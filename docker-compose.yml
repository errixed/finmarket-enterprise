services:
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/api/v1/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: "3001"
      NODE_ENV: ${NODE_ENV:-development}
      MONGO_URI: "${MONGO_URI:-mongodb://mongodb:27017/finmarket_enterprise?replicaSet=rs0}"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_ISSUER: ${JWT_ISSUER:-finmarket-enterprise}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-finmarket-api}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      DELIVERY_EMAIL_PROVIDER: ${DELIVERY_EMAIL_PROVIDER:-mock}
      DELIVERY_FACEBOOK_PROVIDER: ${DELIVERY_FACEBOOK_PROVIDER:-mock}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_PAGE_ID: ${META_PAGE_ID:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb:
    image: mongo:7
    restart: unless-stopped
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    volumes:
      - mongodb_data:/data/db
    networks:
      - app_network
    healthcheck:
      test:
        - CMD
        - mongosh
        - "mongodb://localhost:27017/admin?directConnection=true"
        - --quiet
        - --eval
        - |
          try {
              rs.status();
          } catch (error) {
              if (error.codeName !== "NotYetInitialized") {
                  throw error;
              }

              rs.initiate({
                  _id: "rs0",
                  members: [
                      {
                          _id: 0,
                          host: "mongodb:27017"
                      }
                  ]
              });
          }

          quit(db.hello().isWritablePrimary ? 0 : 1);
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s

networks:
  app_network:
    driver: bridge

volumes:
  mongodb_data: